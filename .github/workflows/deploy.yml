name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull, rebuild and restart
        run: |
          set -e
          cd /opt/cstmr_portal
          sudo git fetch origin main
          sudo git reset --hard origin/main
          sudo docker run --rm -v /opt/cstmr_portal:/repo -w /repo --env-file /opt/cstmr_portal/.env node:22-alpine sh -c "cd /repo && npx --yes prisma@7.10.0 migrate deploy --schema prisma/schema.prisma"
          cd deploy
          sudo docker compose -p deploy -f docker-compose.prod.yml --env-file /opt/cstmr_portal/.env build
          sudo docker compose -p deploy -f docker-compose.prod.yml --env-file /opt/cstmr_portal/.env up -d
          sudo docker image prune -f || true
          sleep 4
          curl -fsS -o /dev/null http://127.0.0.1:3001/login && echo "APP_UP_OK"